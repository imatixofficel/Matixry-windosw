name: Matixray Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload to (for example V1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            core: v2rayN-windows-64.zip
            out: Matixray-windows-64
          - arch: arm64
            rid: win-arm64
            core: v2rayN-windows-arm64.zip
            out: Matixray-windows-arm64
    env:
      Output: "${{ github.workspace }}/app"
      CoreZip: ${{ matrix.core }}
      OutName: ${{ matrix.out }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Purge SDKs
      shell: pwsh
      run: |
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          rm $d -r -fo
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx

    - name: Build Matixray
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./v2rayN/v2rayN.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:EnableWindowsTargeting=true -o "$Output"

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:PublishTrimmed=true -p:EnableWindowsTargeting=true -o "$Output"

    - name: Get cores (xray, sing-box, geo files)
      shell: pwsh
      run: Invoke-WebRequest -Uri "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/$env:CoreZip" -OutFile cores.zip

    - name: Package zip
      shell: pwsh
      run: |
        Expand-Archive cores.zip -DestinationPath tmp
        New-Item -ItemType Directory Matixray | Out-Null
        $top = @(Get-ChildItem tmp)
        if ($top.Count -eq 1 -and $top[0].PSIsContainer) {
          Copy-Item "$($top[0].FullName)\*" Matixray -Recurse -Force
        } else {
          Copy-Item "tmp\*" Matixray -Recurse -Force
        }
        Get-ChildItem app -Filter *.pdb -Recurse | Remove-Item -Force
        Copy-Item "app\*" Matixray -Recurse -Force
        Compress-Archive -Path Matixray -DestinationPath "$env:OutName.zip" -CompressionLevel Fastest

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.out }}
        path: ${{ matrix.out }}.zip

  release:
    name: upload to release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Collect zips
      uses: actions/download-artifact@v8
      with:
        pattern: Matixray-windows-*
        path: dist
        merge-multiple: true

    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.release_tag }}
      run: |
        ls -la dist
        if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
          gh release create "$TAG" --repo "$REPO" --title "Matixray $TAG" --notes "Matixray for Windows"
        fi
        gh release upload "$TAG" dist/*.zip --repo "$REPO" --clobber
