name: Matixray Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: matixray-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build Matixray x64
    runs-on: windows-latest
    env:
      Output: "${{ github.workspace }}/app"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Purge SDKs
      shell: pwsh
      run: |
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          rm $d -r -fo
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx

    - name: Build Matixray
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o "$Output"

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishTrimmed=true -p:EnableWindowsTargeting=true -o "$Output"

    - name: Get cores (xray, sing-box, geo files)
      shell: pwsh
      run: Invoke-WebRequest -Uri "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-windows-64.zip" -OutFile cores.zip

    - name: Package Matixray zip
      shell: pwsh
      run: |
        Expand-Archive cores.zip -DestinationPath tmp
        New-Item -ItemType Directory Matixray | Out-Null
        $top = @(Get-ChildItem tmp)
        if ($top.Count -eq 1 -and $top[0].PSIsContainer) {
          Copy-Item "$($top[0].FullName)\*" Matixray -Recurse -Force
        } else {
          Copy-Item "tmp\*" Matixray -Recurse -Force
        }
        Get-ChildItem app -Filter *.pdb -Recurse | Remove-Item -Force
        Copy-Item "app\*" Matixray -Recurse -Force
        Compress-Archive -Path Matixray -DestinationPath Matixray-windows-64.zip -CompressionLevel Fastest

    - name: Upload Matixray zip
      uses: actions/upload-artifact@v7
      with:
        name: Matixray-windows-64
        path: Matixray-windows-64.zip
